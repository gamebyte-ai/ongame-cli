# ongame — what `codex mcp add` writes for the ongame MCP server (OpenAI Codex CLI).
#
# THIS FILE IS DOCUMENTATION, NOT SOMETHING TO APPEND. The installer no longer pastes a block into your
# config; it runs
#
#     codex mcp add ongame -- /ABSOLUTE/PATH/.ongame/bin/ongame-cli mcp
#
# and Codex itself writes the block below into `$CODEX_HOME/config.toml` (default `~/.codex/config.toml`,
# `%USERPROFILE%\.codex\config.toml` on Windows). Verified against Codex CLI 0.153.4: `codex mcp add` takes
# an absolute command path (your shell expands `~` before Codex sees it), writes exactly `command` + `args`,
# prints `Added global MCP server 'ongame'.`, and a second add for the same name silently overwrites the
# first — so re-running the installer is safe, but it also discards any keys you added by hand under this
# block (re-add them afterwards).
#
#   Check it:   codex mcp get ongame --json     (exit 0 + JSON when registered; exit 1 when not)
#   Remove it:  codex mcp remove ongame
#
# WHY AN ABSOLUTE PATH ON EVERY PLATFORM (not only Windows): Codex resolves `command` with a plain lookup
# when the server starts. A bare `ongame-cli` relies on Codex inheriting the PATH your shell profile set up —
# true in a terminal, not from an IDE or a launcher — and on Windows the lookup does not apply PATHEXT, so
# the bare name finds nothing at all. The earlier installer appended a bare-name block to config.toml by hand
# and on at least one machine the block never landed, leaving Codex with raw tools and no `ongame` server.
# `codex mcp add` with the absolute path closes both failure modes and lets Codex own its own file.
#
# STARTUP TIMEOUT: `codex mcp add` cannot set `startup_timeout_sec`, and Codex's default is 10 seconds.
# ongame-cli checks for a newer release when it starts, so on a slow connection the first launch of a
# session can miss that window and Codex reports the `ongame` server as timed out. If that happens, add the
# commented line below under the block by hand — Codex keeps it until the next `codex mcp add ongame`.

[mcp_servers.ongame]
command = "/Users/you/.ongame/bin/ongame-cli"   # Windows: "C:\\Users\\you\\.ongame\\bin\\ongame-cli.exe"
args = ["mcp"]
# startup_timeout_sec = 120.0   # optional — see STARTUP TIMEOUT above
