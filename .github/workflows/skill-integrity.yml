name: skill-integrity
on:
  pull_request:
    paths:
      - 'skills/**'
      - '.claude-plugin/plugin.json'
      - 'scripts/build-skills-lock.mjs'
      - '.github/workflows/skill-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude-plugin/plugin.json'
      - 'scripts/build-skills-lock.mjs'
      - '.github/workflows/skill-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Verify the plugin version and complete instruction inventory
        run: node scripts/build-skills-lock.mjs --check
